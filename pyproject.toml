[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faster-voxcpm"
version = "0.1.0"
description = "VoxCPM2 inference, about 3x faster, waveform identical to the bit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["tts", "cuda-graphs", "inference", "voxcpm", "speech-synthesis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "License :: OSI Approved :: MIT License",
]

# Neither torch nor voxcpm is pinned here: the right torch wheel depends on the
# CUDA version installed, and pip picking one for you is how environments break.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["faster_voxcpm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
